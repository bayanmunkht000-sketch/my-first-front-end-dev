<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生学习中心</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="#home">学生学习中心</a>

        <div class="navbar-nav">
            <a class="nav-link" href="#home">首页</a>
            <a class="nav-link" href="#tasks">学习任务</a>
            <a class="nav-link" href="#stats">学习统计</a>
            <a class="nav-link" href="three-d/scene.html"> 三维空间</a>
        </div>

    </div>
</nav>

    <section id="home" class="container py-5">

    <div class="p-5 bg-light rounded">

        <h2>欢迎来到学生学习中心</h2>

        <p>
            管理你的学习任务，查看学习统计，并进入三维学习空间。
        </p>

        <a href="#tasks" class="btn btn-primary">
            查看学习任务
        </a>

    </div>

</section>

<section id="tasks" class="container py-5">
    <h2>学习任务</h2>
    <select id="subjectFilter" class="form-select">
        <option value="all">全部科目</option>
        <option value="cs">计算机</option>
        <option value="chinese">汉语</option>
        <option value="spanish">西班牙语</option>
    </select>

    <select id="statusFilter" class="form-select">
        <option value="all">全部状态</option>
        <option value="pending">未完成</option>
        <option value="done">已完成</option>
    </select>

    <div id="taskList" class="row g-3 mt-3"></div>
    
</section>

<section id="stats" class="container py-5">
    <h2>学习统计</h2>
    <p id="dataError" class="text-danger"></p>

<div style="height: 400px;">
    <canvas id="studyChart"></canvas>
</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script src="js/app.js"></script>
</body>
</html>
