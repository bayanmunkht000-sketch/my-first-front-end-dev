<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>图书收藏管理</title>
</head>

<body>

    <h1>图书收藏管理</h1>

    <form id="book-form">

        <input id="title-input" type="text" placeholder="书名">

        <input id="author-input" type="text" placeholder="作者">

        <input id="rating-input" type="number" placeholder="评分">

        <button type="submit">添加图书</button>

    </form>

    <p id="tip"></p>

    <input id="search-input" type="text" placeholder="搜索书名">

    <ul id="book-list"></ul>

    <script src="app.js"></script>

</body>

</html>
