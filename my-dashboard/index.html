<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Spending Dashboard</title>
  <style>
  .chart-box {
    height: 360px;
    margin-top: 20px;
  }

  .selected-card {
  background-color: #eeeeee;
  border: 2px solid #333333;
  padding: 10px;
  }
  </style>
</head>

<body>

  <h1>My Spending Dashboard</h1>

  <p id="sub-title">
    Data source: Personal spending practice data
  </p>

  <p id="status"></p>

  <section id="cards"></section>

  <section>
  <h2>Monthly Spending by Category</h2>

  <div
    id="bar-chart"
    class="chart-box"
  ></div>
  </section>
  <section>
  <h2>Monthly Spending Trend</h2>

  <div class="chart-box">
    <canvas id="line-chart"></canvas>
  </div>
  </section>

<script src="libs/jquery-3.7.1.min.js"></script>
<script src="libs/echarts.min.js"></script>
<script src="libs/chart.umd.js"></script>
<script src="app.js"></script>

</body>

</html>
