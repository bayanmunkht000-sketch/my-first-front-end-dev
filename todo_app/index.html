<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>任务清单</title>

    <style>
        .done {
            text-decoration: line-through;
        }
    </style>
</head>

<body>

    <h1>任务清单</h1>

    <form id="add-form">
        <input id="task-input" type="text" placeholder="输入任务">
        <button type="submit">添加</button>
    </form>

    <p id="tip"></p>

    <ul id="task-list"></ul>

    <div class="filters">
        <button data-filter="all">全部</button>
        <button data-filter="active">未完成</button>
        <button data-filter="done">已完成</button>
    </div>

    <script src="app.js"></script>

</body>

</html>
