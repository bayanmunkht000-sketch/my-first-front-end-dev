<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>校园信息中心</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

      <a class="navbar-brand" href="#">校园信息中心</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNav">

        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link active" href="#home">首页</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#rooms">自习室</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#statistics">统计</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="three-d/scene.html">校园三维</a>
          </li>

        </ul>

      </div>
    </div>
  </nav>


  <main class="container mt-4">

  <section id="home">
  <h1 class="mb-4">校园信息中心</h1>

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">📚 自习室查询</h5>
          <p class="card-text">
            查看不同楼层和开放状态的自习室。
          </p>
          <a href="#rooms" class="btn btn-primary">查看自习室</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">📊 使用统计</h5>
          <p class="card-text">
            查看校园自习室的使用情况和数据统计。
          </p>
          <a href="#statistics" class="btn btn-primary">查看统计</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">🌍 校园三维</h5>
          <p class="card-text">
            进入校园三维场景并查看校园地标。
          </p>
          <a href="three-d/scene.html" class="btn btn-primary">进入三维场景</a>
        </div>
      </div>
    </div>

  </div>
</section>

<section id="rooms" class="mt-5">
  <h2>自习室查询</h2>

  <div class="row g-3 mb-4">

    <div class="col-md-6">
      <label for="floorFilter" class="form-label">楼层</label>

      <select id="floorFilter" class="form-select">
        <option value="all">全部楼层</option>
        <option value="1">1楼</option>
        <option value="2">2楼</option>
        <option value="3">3楼</option>
      </select>
    </div>

    <div class="col-md-6">
      <label for="statusFilter" class="form-label">开放状态</label>

      <select id="statusFilter" class="form-select">
        <option value="all">全部状态</option>
        <option value="open">开放</option>
        <option value="closed">关闭</option>
      </select>
    </div>

  </div>

  <div id="roomList" class="row g-3"></div>

</section>

    <section id="statistics" class="mt-5">
      <h2>使用统计</h2>
      <p>这里以后放数据图表。</p>
    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <script src="js/app.js"></script>

</body>
</html>
